<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blood Diagnosis Tool</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bdt-blood-diagnostic.netlify.app/">
    <meta property="og:title" content="Blood Diagnostic Tool - AI-Powered Medical Diagnosis">
    <meta property="og:description" content="Advanced AI-powered blood diagnostic tool for medical professionals. Get instant analysis and clinical insights for better patient care.">
    <meta property="og:image" content="https://bdt-blood-diagnostic.netlify.app/assets/images/social-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Blood Diagnostic Tool">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://bdt-blood-diagnostic.netlify.app/">
    <meta property="twitter:title" content="Blood Diagnostic Tool - AI-Powered Medical Diagnosis">
    <meta property="twitter:description" content="Advanced AI-powered blood diagnostic tool for medical professionals. Get instant analysis and clinical insights for better patient care.">
    <meta property="twitter:image" content="https://bdt-blood-diagnostic.netlify.app/assets/images/social-preview.png">
    
    <!-- Additional SEO -->
    <meta name="description" content="Advanced AI-powered blood diagnostic tool for medical professionals. Get instant analysis and clinical insights for better patient care.">
    <meta name="keywords" content="blood diagnostic, medical AI, healthcare, diagnosis, clinical analysis, medical professionals">
    <meta name="author" content="Blood Diagnostic Tool">
    
    <!-- Import Work Sans font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS Imports -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/session-list.css">
    <link rel="stylesheet" href="css/chat-interface.css">
    <link rel="stylesheet" href="css/medical.css">
    <link rel="stylesheet" href="css/shimmer.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Connection Status Indicator -->
    <div id="connectionStatus" class="connection-status unknown">Connecting...</div>
    
    <div class="main-container">
        <div class="left-container">
            <div class="top-container">
                <div class="chat-history">
                    <!-- Chat items will be added dynamically -->
                </div>
            </div>
            <div class="bottom-container">
                <div class="user-profile">
                    <div class="user-avatar-container">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRT7ZW1MttWL5hg-E0pJuXIftWMBhUpcifEsA&s" alt="Mihir Shah" style="width: 100%; height: 100%; border-radius: 8px; object-fit: cover;">
                    </div>
                    <div class="user-info">
                        <div class="user-name">Dr. Viraj</div>
                        <div class="user-role">General Practitioner</div>
                    </div>
                </div>
                <div class="shimmer-test-section">
                    <button class="shimmer-test-btn" id="shimmerTestBtn" title="Test shimmer effect" aria-label="Test shimmer effect" role="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Test Shimmer
                    </button>
                </div>
            </div>
        </div>
        <div class="right-container">
            <div class="right-top-container">
                <div class="chat-container">
                    <div class="welcome-section" id="welcomeSection">
                        <svg width="31" height="30" viewBox="0 0 31 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.0129 2.67236C12.9723 -0.890788 18.0277 -0.890787 18.9871 2.67236L20.3219 7.62994C20.6565 8.87273 21.6273 9.8435 22.8701 10.1781L27.8276 11.5129C31.3908 12.4723 31.3908 17.5277 27.8276 18.4871L22.8701 19.8219C21.6273 20.1565 20.6565 21.1273 20.3219 22.3701L18.9871 27.3276C18.0277 30.8908 12.9723 30.8908 12.0129 27.3276L10.6781 22.3701C10.3435 21.1273 9.37273 20.1565 8.12994 19.8219L3.17236 18.4871C-0.390788 17.5277 -0.390787 12.4723 3.17236 11.5129L8.12994 10.1781C9.37273 9.8435 10.3435 8.87273 10.6781 7.62994L12.0129 2.67236Z" fill="#19B76A"/>
                        </svg>
                        <p>Hello, Viraj!<br>
                        How can I help you today?</p>
                    </div>
                    <div class="chat-conversation" id="chatConversation">
                        <!-- Messages will be added here dynamically -->
                    </div>
                </div>
            </div>
            <div class="right-bottom-container">
                <div class="input-section">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="message-input" 
                            placeholder="Type your message here..."
                            rows="1"
                            maxlength="2000"
                        ></textarea>
                        <button id="sendBtn" class="send-btn" aria-label="Send message">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Imports -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
